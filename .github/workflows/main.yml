name: NoScroll Daily News

on:
  schedule:
    # UTC 22:00 = KST 07:00
    - cron: '55 19 * * *'
  workflow_dispatch:

# GitHub Pages 배포를 위한 쓰기 권한
permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v3

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install google-genai feedparser requests pyyaml

      - name: 뉴스 수집 & 리포트 생성
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python nscrll.py

      - name: GitHub Pages에 리포트 배포
        run: |
          git config user.name "NoScroll Bot"
          git config user.email "noscroll@users.noreply.github.com"
          git add docs/
          git diff --staged --quiet || git commit -m "📰 NoScroll $(date +%Y-%m-%d)"
          git push
