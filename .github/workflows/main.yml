name: NoScroll Daily News

on:
  schedule:
    # UTC 22:00 = KST 07:00 (아침 7시)
    - cron: '0 22 * * *'
  workflow_dispatch: # 수동 테스트 버튼

jobs:
  run-bot:
    runs-on: ubuntu-latest
    steps:
      - name: 저장소 코드 불러오기
        uses: actions/checkout@v4

      - name: 파이썬 환경 세팅
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 필수 라이브러리 설치
        run: |
          pip install google-genai feedparser requests pyyaml

      - name: 파이썬 스크립트 실행 (텔레그램 전송)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python nscrll.py
